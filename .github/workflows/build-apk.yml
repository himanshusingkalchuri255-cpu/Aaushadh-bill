name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare web bundle
        run: |
          if [ -f "package.json" ] && [ -d "src" ]; then
            npm install
            NODE_ENV=production npm run build
          else
            ZIP_FILE=$(find . -maxdepth 2 -iname "*.zip" | sort -Vr | head -n 1)
            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: Repo me koi .zip file nahi mili. Pehle Code tab me Add file -> Upload files se .zip upload karein."
              exit 1
            fi
            echo "Found ZIP: $ZIP_FILE"
            rm -rf _unpacked dist
            mkdir -p _unpacked dist
            unzip -o "$ZIP_FILE" -d _unpacked
            if [ -f "_unpacked/index.html" ]; then
              cp -r _unpacked/. dist/
            elif [ -f "_unpacked/package.json" ]; then
              cd _unpacked && npm install && NODE_ENV=production npm run build && cd ..
              cp -r _unpacked/dist/. dist/
            else
              SUBDIR=$(find _unpacked -mindepth 1 -maxdepth 2 -name "index.html" | head -n 1)
              if [ -n "$SUBDIR" ]; then
                cp -r "$(dirname "$SUBDIR")/." dist/
              else
                echo "ERROR: ZIP ke andar index.html ya package.json nahi mila."
                exit 1
              fi
            fi
            rm -rf _unpacked
            if [ ! -f "package.json" ]; then
              printf '{"name":"aaushadh-bill","version":"1.0.0","private":true}\n' > package.json
            fi
            if [ -f "dist/capacitor.config.json" ]; then
              cp dist/capacitor.config.json capacitor.config.json
            fi
          fi

      - name: Setup Capacitor Android
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          npx cap ls android

      - name: Apply App Icon if available
        run: |
          if [ -f "dist/icon-512.png" ] && command -v convert >/dev/null 2>&1; then
            for pair in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
              dir="${pair%%:*}"
              sz="${pair##*:}"
              target_dir="android/app/src/main/res/mipmap-$dir"
              if [ -d "$target_dir" ]; then
                convert dist/icon-512.png -resize "${sz}x${sz}" "$target_dir/ic_launcher.png" || true
                convert dist/icon-512.png -resize "${sz}x${sz}" "$target_dir/ic_launcher_round.png" || true
                convert dist/icon-512.png -resize "${sz}x${sz}" "$target_dir/ic_launcher_foreground.png" || true
              fi
            done
          fi

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aaushadh-Bill-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
