name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Prepare web bundle
        run: |
          mkdir -p dist
          unzip -o aaushadh-bill-android.zip -d dist
          printf '{"name":"aaushadh-bill","version":"1.0.0","private":true}\n' > package.json
          cp dist/capacitor.config.json capacitor.config.json
      - name: Build Android APK
        run: |
          npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          npx cap sync android
          if [ -f "dist/icon-512.png" ] && command -v convert >/dev/null 2>&1; then
            for pair in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
              dir="${pair%%:*}"; sz="${pair##*:}"
              target="android/app/src/main/res/mipmap-$dir"
              if [ -d "$target" ]; then
                convert dist/icon-512.png -resize "${sz}x${sz}" "$target/ic_launcher.png" || true
                convert dist/icon-512.png -resize "${sz}x${sz}" "$target/ic_launcher_round.png" || true
                convert dist/icon-512.png -resize "${sz}x${sz}" "$target/ic_launcher_foreground.png" || true
              fi
            done
          fi
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Aaushadh-Bill-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
